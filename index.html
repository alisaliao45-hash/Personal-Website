<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alisa Liao | Designer, Researcher, Artist</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo active">H O M E</a>
            <ul class="nav-menu">
                <li><a href="work.html">W O R K</a></li>
                <li><a href="#art">A R T</a></li>
                <li><a href="#me">M E</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">ALISA LIAO</h1>
            <p class="hero-subtitle">DESIGNER · RESEARCHER · ARTIST</p>
        </div>
        <p class="hero-quote">"EVERYTHING YOU CAN IMAGINE IS REAL" -PABLO PICASSO</p>
        <div class="hero-illustration">
            <img src="gibbon.png" alt="Gibbon Illustration" class="gibbon">

        <div class="ink-drag-layer">
            <canvas class="ink-canvas"></canvas>
            <img src="hand_gibbon.png" alt="Hand Gibbon Illustration" class="hand-gibbon">
        </div>

    <!-- Featured Work Section -->
    <section class="featured-work">

        <div class="work-grid">
            <div class="work-item">
                <div class="work-card"></div>

            </div>
            <div class="work-item">
                <div class="work-card"></div>
                <div class="work-pin pin-2"></div>
            </div>
            <div class="work-item">
                <div class="work-card"></div>
                <div class="work-pin pin-3"></div>
            </div>
            <div class="work-item">
                <div class="work-card"></div>
                <div class="work-pin pin-4"></div>
            </div>
        </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-links">
            <a href="#email">E M A I L</a>
            <a href="#tiktok">T I K T O K</a>
            <a href="#instagram">I N S T A G R A M</a>

    <script src="script.js"></script>
